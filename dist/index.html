<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read English news and watch videos together, and collect notes and words as a group.">
  <title>axciting</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700;900&family=Instrument+Serif&display=swap">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./design.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="top"><div class="top-inner">
    <a class="brand" href="#home"><img class="logo" src="./favicon.svg" alt="">axciting</a>
    <nav aria-label="Main menu" id="nav"><a href="#home">Home</a><a href="#explore">Explore</a><a href="#feed">Board</a><a href="#words">Vocab</a><a class="aux" href="#scraps">Saved</a></nav>
    <button id="choose-member" type="button">Choose your name</button>
  </div></header>
  <div class="shell">
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="member-drawer" aria-labelledby="member-drawer-title">
    <div class="dialog-head"><h2 id="member-drawer-title">Members</h2><form method="dialog"><button aria-label="Close member list">✕</button></form></div>
    <nav id="members" aria-label="Board by member"></nav>
    <button type="button" id="rename-members">Manage members</button>
  </dialog>
  <dialog id="editor"></dialog>
  <dialog id="member-editor" aria-labelledby="member-editor-title"></dialog>
  <dialog id="member-picker" aria-labelledby="member-picker-title"></dialog>
  <dialog id="tv-overlay" aria-label="Item details"></dialog>
  <div id="notice" role="status"></div>
  <div id="route-announcer" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
